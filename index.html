<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>iPad Kalender</title>
<style>
:root{--panel:rgba(2,7,11,.86);--line:rgba(255,255,255,.22);--text:#fff;--muted:rgba(255,255,255,.72)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0f1115}
body:before{content:"";position:fixed;inset:0;background:transparent;pointer-events:none}body{padding:8px}.app{position:relative;height:calc(100vh - 16px);display:grid;grid-template-rows:54px 1fr;gap:7px}.top{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.25)}
.clock{padding:7px 16px;display:flex;align-items:center;background:rgba(2,7,11,.52)}#time{font-size:29px;font-weight:700;letter-spacing:-1px;line-height:1}#date{margin-top:2px;font-size:10px;color:#fff}.weather{padding:6px 14px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:rgba(2,7,11,.52)}#weatherIcon{font-size:24px}#temp{font-size:21px;font-weight:700;line-height:1}#weatherText,#weatherPlace{color:var(--muted);font-size:9px;line-height:1.25}
.main{min-height:0;display:grid;grid-template-columns:70fr 30fr;gap:4px}.calendarCard{min-height:0;padding:6px;display:grid;grid-template-rows:31px 1fr;background:rgba(0,4,7,.90)}.header{display:flex;justify-content:space-between;align-items:center;padding:0 5px 5px;border-bottom:1px solid rgba(255,255,255,.14)}.title{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}.small{font-size:9px;color:var(--muted)}.frameWrap{min-height:0;background:white;border-radius:6px;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block;background:white}
@media(max-width:850px){body{padding:5px}.app{height:calc(100vh - 10px);grid-template-rows:50px 1fr;gap:5px}.top{gap:5px}.main{gap:4px}.clock{padding:5px 10px}#time{font-size:27px}#date{font-size:9px}.weather{padding:4px 9px;gap:7px}#weatherIcon{font-size:22px}#temp{font-size:20px}#weatherText,#weatherPlace{font-size:8px}.main{grid-template-columns:70fr 30fr}.calendarCard{padding:5px;grid-template-rows:27px 1fr}.title{font-size:14px}.small{font-size:8px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <section class="card clock">
      <div>
        <div id="time">--:--</div>
        <div id="date">Datum wird geladen …</div>
      </div>
    </section>
    <section class="card weather">
      <div id="weatherIcon">🌤️</div>
      <div>
        <div id="temp">--°</div>
        <div id="weatherText">Wetter wird geladen …</div>
        <div id="weatherPlace">Standort</div>
      </div>
    </section>
  </div>

  <main class="main">
    <section class="card calendarCard">
      <div class="header">
        <div class="title" id="monthTitle">Kalender</div>
        <div class="small">Google Kalender</div>
      </div>
      <div class="frameWrap">
        <iframe id="calendarFrame" src="https://calendar.google.com/calendar/embed?src=nsponseil%40gmail.com&ctz=Europe%2FBerlin" title="Google Kalender Monatsansicht"></iframe>
      </div>
    </section>

    <section class="card calendarCard">
      <div class="header">
        <div class="title">Termine</div>
        <div class="small">Agenda</div>
      </div>
      <div class="frameWrap">
        <iframe id="agendaFrame" src="https://calendar.google.com/calendar/embed?src=nsponseil%40gmail.com&ctz=Europe%2FBerlin&mode=AGENDA" title="Google Kalender Agenda"></iframe>
      </div>
    </section>
  </main>
</div>

<script>
(function() {
  "use strict";

  var months=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  var days=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

  function pad(n) { return n < 10 ? "0"+n : String(n); }

  function clock() {
    var d=new Date();
    document.getElementById("time").textContent=pad(d.getHours())+":"+pad(d.getMinutes());
    document.getElementById("date").textContent=days[d.getDay()]+" · "+d.getDate()+". "+months[d.getMonth()]+" "+d.getFullYear();
    document.getElementById("monthTitle").textContent=months[d.getMonth()]+" "+d.getFullYear();
  }
  clock();
  setInterval(clock,1000);

  function weatherCode(c) {
    if(c===0) return ["☀️","Klar"];
    if(c===1||c===2) return ["🌤️","Teilweise bewölkt"];
    if(c===3) return ["☁️","Bewölkt"];
    if(c===45||c===48) return ["🌫️","Nebel"];
    if(c>=51&&c<=57) return ["🌦️","Nieselregen"];
    if(c>=61&&c<=67) return ["🌧️","Regen"];
    if(c>=71&&c<=77) return ["🌨️","Schnee"];
    if(c>=80&&c<=82) return ["🌦️","Regenschauer"];
    if(c>=85&&c<=86) return ["🌨️","Schneeschauer"];
    if(c>=95) return ["⛈️","Gewitter"];
    return ["🌤️","Wetter"];
  }

  function loadWeather(lat,lon,label) {
    var url="https://api.open-meteo.com/v1/forecast?latitude="+encodeURIComponent(lat)+
      "&longitude="+encodeURIComponent(lon)+"&current=temperature_2m,weather_code&timezone=auto";
    fetch(url).then(function(r){return r.json();}).then(function(data){
      var cur=data.current||{};
      var wc=weatherCode(Number(cur.weather_code));
      document.getElementById("weatherIcon").textContent=wc[0];
      document.getElementById("temp").textContent=Math.round(Number(cur.temperature_2m))+"°";
      document.getElementById("weatherText").textContent=wc[1];
      document.getElementById("weatherPlace").textContent=label;
    }).catch(function(){
      document.getElementById("weatherText").textContent="Wetter nicht erreichbar";
    });
  }

  function weather() {
    if(navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(p){loadWeather(p.coords.latitude,p.coords.longitude,"Aktueller Standort");},
        function(){loadWeather(49.4521,11.0767,"Nürnberg");},
        {enableHighAccuracy:false,timeout:7000,maximumAge:3600000}
      );
    } else {
      loadWeather(49.4521,11.0767,"Nürnberg");
    }
  }
  weather();
  setInterval(weather,30*60*1000);

  var calendarUrl="https://calendar.google.com/calendar/embed?src=nsponseil%40gmail.com&ctz=Europe%2FBerlin";
  var agendaUrl="https://calendar.google.com/calendar/embed?src=nsponseil%40gmail.com&ctz=Europe%2FBerlin&mode=AGENDA";

  function refreshCalendars() {
    document.getElementById("calendarFrame").src=calendarUrl;
    document.getElementById("agendaFrame").src=agendaUrl;
  }
  setInterval(refreshCalendars,5*60*1000);
})();
</script>
</body>
</html>
